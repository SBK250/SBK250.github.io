<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sai Baba Kancherla | Data Science & AI Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#0b1120;
color:white;
overflow-x:hidden;
}

nav{
position:fixed;
width:100%;
top:0;
background:rgba(15,23,42,.85);
backdrop-filter:blur(12px);
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
}

.logo{
font-size:1.4rem;
font-weight:700;
color:#60a5fa;
}

nav ul{
display:flex;
list-style:none;
gap:25px;
}

nav a{
text-decoration:none;
color:white;
transition:.3s;
}

nav a:hover{
color:#60a5fa;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:120px 8%;
gap:80px;
}

.hero-content{
flex:1;
}

.hero-content h1{
font-size:4rem;
line-height:1.1;
margin-bottom:20px;
}

.hero-content span{
color:#60a5fa;
}

.hero-content p{
font-size:1.1rem;
color:#cbd5e1;
margin-bottom:30px;
max-width:700px;
}

.btns{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.btn{
padding:14px 28px;
border-radius:12px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.primary{
background:#2563eb;
color:white;
}

.primary:hover{
transform:translateY(-4px);
}

.secondary{
border:1px solid #60a5fa;
color:#60a5fa;
}

.secondary:hover{
background:#60a5fa;
color:black;
}

.hero-image{
flex:1;
display:flex;
justify-content:center;
}

.hero-image img{
width:420px;
height:420px;
object-fit:cover;
border-radius:50%;
border:6px solid #2563eb;
box-shadow:0 0 60px rgba(37,99,235,.5);
}

.section{
padding:100px 8%;
}

.section-title{
font-size:2.5rem;
margin-bottom:50px;
color:#60a5fa;
text-align:center;
}

.glass{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:30px;
}

.skills-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.skill-card{
padding:25px;
background:#111827;
border-radius:18px;
transition:.3s;
}

.skill-card:hover{
transform:translateY(-8px);
}

.projects{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

.project-card{
background:#111827;
padding:25px;
border-radius:20px;
transition:.3s;
}

.project-card:hover{
transform:translateY(-10px);
}

footer{
text-align:center;
padding:40px;
color:#94a3b8;
}

@media(max-width:900px){

.hero{
flex-direction:column-reverse;
text-align:center;
}

.hero-content h1{
font-size:2.8rem;
}

.hero-image img{
width:280px;
height:280px;
}
}
</style>
</head>

<body>

<nav>
<div class="logo">Sai Baba Kancherla</div>

<ul>

<li><a href="#contact">Contact</a></li>
</ul>
</nav>

<p>
M.Sc. Applied Data Science & Artificial Intelligence Student |
Data Analytics | Business Intelligence | AI & Machine Learning

<br><br>
📍 Nürnberg, Germany | 🇩🇪 German A2

</div>

</div>

<div class="hero-image">
<img src="profile.jpeg" alt="Sai Baba Kancherla">

</section>

</body>
</html>
